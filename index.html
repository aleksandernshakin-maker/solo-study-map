<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#050810">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Solo Study Map</title>
</head>
<body>
  <div id="boot" class="boot-screen">
    <div class="boot-rune">◇</div>
    <h1>SOLO STUDY MAP</h1>
    <p>Инициализация мира знаний…</p>
    <div class="boot-line"><i></i></div>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <button class="brand" data-action="go-home" aria-label="Главная">
        <span class="brand-mark">◇</span><span>SOLO STUDY MAP</span>
      </button>
      <div id="breadcrumbs" class="breadcrumbs" aria-label="Текущий путь"></div>
      <div class="top-actions">
        <button class="icon-btn" data-action="search" aria-label="Поиск" title="Поиск">⌕</button>
        <button class="icon-btn" data-action="review" aria-label="Повторение" title="Повторение">↻</button>
        <button class="icon-btn" data-action="toggle-edit" aria-label="Редактор" title="Редактор">✦</button>
        <button class="icon-btn" data-action="settings" aria-label="Настройки" title="Настройки">⚙</button>
      </div>
    </header>

    <nav class="navrail" aria-label="Разделы">
      <button data-view="home" class="nav-item active"><span>⌂</span><small>Святилище</small></button>
      <button data-view="library" class="nav-item"><span>▤</span><small>Курсы</small></button>
      <button data-view="world" class="nav-item"><span>◈</span><small>Мир</small></button>
      <button data-view="bestiary" class="nav-item"><span>♞</span><small>Бестиарий</small></button>
      <button data-view="chronicle" class="nav-item"><span>☷</span><small>Хроника</small></button>
      <button data-view="settings" class="nav-item"><span>⚙</span><small>Настройки</small></button>
    </nav>

    <main id="main" class="main"></main>

    <aside id="inspector" class="inspector" hidden></aside>
    <div id="modalRoot" class="modal-root" aria-live="polite"></div>
    <div id="toastRoot" class="toast-root" aria-live="polite"></div>
    <div id="cinematic" class="cinematic" hidden><div class="cinematic-inner"><div id="cinematicSigil" class="cinematic-sigil">◇</div><div id="cinematicKicker" class="cinematic-kicker"></div><div id="cinematicTitle" class="cinematic-title"></div></div></div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
